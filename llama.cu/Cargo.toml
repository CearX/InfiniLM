[package]
name = "llama-cu"
version = "0.0.0"
edition.workspace = true

[dependencies]
operators = { git = "https://github.com/CearX/operators-rs.git", rev = "8a0d58a", default-features = false, features = ["nvidia-gpu", "common-cpu"] }
nn = { git = "https://github.com/CearX/InfiniNN.git", rev = "74b1bea" }
ggus = { git = "https://github.com/InfiniTensor/gguf", rev = "23c362f" }
tokeneer = { git = "https://github.com/InfiniTensor/tokeneer", rev = "c48f39f" }

bytesize = "2.0"
log.workspace = true
regex.workspace = true
serde.workspace = true
memmap2 = "0.9"
lru = "0.14"
rand = "0.9"
minijinja = { version = "2.11", default-features = false, features = [
    "loader",
    "builtins",
    "serde",
] }
half = "2.4"
ndarray-layout = "0.2"
mem-rearrange = "0.1.1"
image = "0.25.6"
ndarray = "0.16.1"

[build-dependencies]
build-script-cfg = "0.1"
search-cuda-tools = { git = "https://github.com/YdrMaster/cuda-driver", rev = "c535e9f" }
search-maca-tools = { git = "https://github.com/YdrMaster/cuda-driver", rev = "c535e9f" }
search-corex-tools = { git = "https://github.com/YdrMaster/cuda-driver", rev = "c535e9f" }
cuda-cc = { git = "https://github.com/YdrMaster/cuda-driver", rev = "c535e9f" }
