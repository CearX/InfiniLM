[package]
name = "llama-cu"
version = "0.0.0"
edition.workspace = true

[dependencies]
operators = { git = "https://github.com/CearX/operators-rs.git", rev = "cebb6de292dc8abcf89964e20d6e64ab9279c608", default-features = false, features = ["nvidia-gpu", "common-cpu"] }

nn = { git = "https://github.com/CearX/InfiniNN.git", rev = "e23af3cf292297c708711fc2b3d6a45667117b69" }
ggus = { git = "https://github.com/InfiniTensor/gguf", rev = "23c362f" }
tokeneer = { git = "https://github.com/InfiniTensor/tokeneer", rev = "c48f39f" }
clip = { git ="https://github.com/CearX/InfiniLM.git", rev = "c7c7693"}
test-utils = { git ="https://github.com/CearX/InfiniLM.git", rev = "c7c7693"}
half = "2.4"
ndarray-layout = "0.2"
mem-rearrange = "0.1.1"

bytesize = "2.0"
log.workspace = true
regex.workspace = true
serde.workspace = true
memmap2 = "0.9"
lru = "0.14"
rand = "0.9"
minijinja = { version = "2.10", default-features = false, features = [
    "loader",
    "builtins",
    "serde",
] }

[build-dependencies]
bindgen = { version = "0.71" }
build-script-cfg = "0.1"
search-cuda-tools = { git = "https://github.com/YdrMaster/cuda-driver", rev = "b0148c0" }
search-maca-tools = { git = "https://github.com/YdrMaster/cuda-driver", rev = "b0148c0" }
search-corex-tools = { git = "https://github.com/YdrMaster/cuda-driver", rev = "b0148c0" }
